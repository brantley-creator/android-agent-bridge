name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Prepare a release keystore when the secrets exist
        id: signing
        env:
          ABRIDGE_KEYSTORE_B64: ${{ secrets.ABRIDGE_KEYSTORE_B64 }}
          ABRIDGE_KEYSTORE_PASSWORD: ${{ secrets.ABRIDGE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ABRIDGE_KEYSTORE_B64" ] && [ -n "$ABRIDGE_KEYSTORE_PASSWORD" ]; then
            echo "$ABRIDGE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/abridge-release.jks"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "file=$RUNNER_TEMP/abridge-release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and unit-test
        env:
          ABRIDGE_KEYSTORE_FILE: ${{ steps.signing.outputs.file }}
          ABRIDGE_KEYSTORE_PASSWORD: ${{ secrets.ABRIDGE_KEYSTORE_PASSWORD }}
          ABRIDGE_KEY_ALIAS: ${{ secrets.ABRIDGE_KEY_ALIAS }}
          ABRIDGE_KEY_PASSWORD: ${{ secrets.ABRIDGE_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            ./gradlew :app:assembleRelease --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/app-release.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/app-debug.apk"
          fi
          cd "$GITHUB_WORKSPACE"
          sha256sum app-*.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: abridge-apk
          path: |
            app-*.apk
            SHA256SUMS
      - name: Attach the APK to the GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          fail_on_unmatched_files: false
          files: |
            app-debug.apk
            app-release.apk
            SHA256SUMS
          body: |
            The debug APK from this workflow is signed with the runner's throwaway debug key.
            A new release may need an uninstall before it will install over an older debug build (signature mismatch).
            An unsigned release APK cannot be installed.
            When repository secrets ABRIDGE_KEYSTORE_B64 and ABRIDGE_KEYSTORE_PASSWORD are present, this job builds a signed release APK instead.
            The keystore alias defaults to abridge. Set ABRIDGE_KEY_ALIAS and ABRIDGE_KEY_PASSWORD if the key uses different values.
            SHA256SUMS covers the APK attached to this release.
