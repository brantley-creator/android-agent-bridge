name: ci

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build and unit-test
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :harness:assembleDebug :app:testDebugUnitTest --stacktrace

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          WRANGLER_SEND_METRICS: "false"

  box:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: box
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: box/package-lock.json
      - run: npm ci
      - run: npm test

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed on forbidden flags
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=build "isAccessibilityTool" . ; then
            echo "isAccessibilityTool must never be set"
            exit 1
          fi
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=build "QUERY_ALL_PACKAGES" . ; then
            echo "QUERY_ALL_PACKAGES is not allowed"
            exit 1
          fi
          if grep -RIn "wrangler deploy" .github relay/package.json box/package.json ; then
            echo "deploy is out of scope"
            exit 1
          fi
          grep -q 'cleartextTrafficPermitted="false"' app/src/main/res/xml/network_security_config.xml
          grep -q 'localhost' app/src/debug/res/xml/network_security_config.xml
          grep -q '10.0.2.2' app/src/debug/res/xml/network_security_config.xml
